name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Verify SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore StudyTime.sln

      - name: Build
        run: dotnet build StudyTime.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test StudyTime.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/StudyTime.Api/StudyTime.Api.csproj --configuration Release --no-restore --output ./artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: studytime-api
          path: ./artifacts/publish