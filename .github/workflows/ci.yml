name: StudyTime CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-test-publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore StudyTime.slnx

      - name: Build solution
        run: dotnet build StudyTime.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test StudyTime.slnx --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/StudyTime.Api/StudyTime.Api.csproj --configuration Release --no-build --output ./artifacts/publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: studytime-api
          path: ./artifacts/publish