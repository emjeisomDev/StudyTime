services:
  postgres:
    image: postgres:17-alpine
    container_name: studytime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studytime
      POSTGRES_USER: studytime
      POSTGRES_PASSWORD: studytime
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - studytime-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studytime -d studytime"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studytime-postgres-data: