### `StudyTime/docker-compose.yml`
###yaml
services:
  postgres:
    image: postgres:17
    container_name: studytime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studytime
      POSTGRES_USER: studytime
      POSTGRES_PASSWORD: studytime_dev
    ports:
      - "5432:5432"
    volumes:
      - studytime_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  studytime_postgres_data: