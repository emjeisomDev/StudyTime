services:
  postgres:
    image: postgres:17
    container_name: studytime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studytime
      POSTGRES_USER: studytime
      POSTGRES_PASSWORD: studytime_dev
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studytime -d studytime"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: studytime-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@studytime.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5151:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: